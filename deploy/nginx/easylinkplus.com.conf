# Reference nginx server block for the easylink-solar-ad microsite.
#
# NOT applied on the box yet. This mirrors the pattern already in use for
# easylinksolar.com.au (see /etc/nginx/sites-enabled/easylinksolar.com.au on
# the instance), proxying to the app's dedicated port instead of 3000/3001.
#
# To go live:
#   1. Point easylinkplus.com's DNS A record (and www) at the instance's
#      public IP (currently the box behind ec2-32-236-111-56.ap-southeast-2
#      .compute.amazonaws.com).
#   2. Copy this file to /etc/nginx/sites-available/easylinkplus.com on the
#      instance, then: sudo ln -s /etc/nginx/sites-available/easylinkplus.com
#      /etc/nginx/sites-enabled/easylinkplus.com
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d easylinkplus.com -d www.easylinkplus.com
#      (this rewrites the listen/ssl_certificate lines below in place, same
#      as it already did for easylinksolar.com.au)

server {
    server_name easylinkplus.com www.easylinkplus.com;

    location / {
        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
}
